name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Owner: Actions → CI → Run workflow → optional firmware version (e.g. 1.1.0) for an OTA release build.
  workflow_dispatch:
    inputs:
      firmware_version:
        description: 'ESP32 firmware version (semver, e.g. 1.1.0). Empty = 1.0.0-ci.<run number>'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.21.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks git --redact --verbose .

  hosting-check:
    name: Hosting check script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: infrastructure/hosting-check/tests/run.sh

  protocol:
    name: Protocol schemas + types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/protocol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/protocol/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check-generated
      - run: npm run typecheck
      - run: npm test

  api:
    name: API tests (${{ matrix.db }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { db: mysql, php: '8.3', image: 'mysql:8.0', port: 3306, user: root }
          - { db: mariadb, php: '8.3', image: 'mariadb:10.6', port: 3306, user: root }
          - { db: pgsql, php: '8.3', image: 'postgres:13', port: 5432, user: postgres }
          - { db: mysql, php: '8.4', image: 'mysql:8.0', port: 3306, user: root }
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bilyart_test
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: bilyart_test
          POSTGRES_PASSWORD: root
          POSTGRES_DB: bilyart_test
        ports:
          - 5555:${{ matrix.port }}
        options: >-
          --health-cmd "${{ matrix.db == 'pgsql' && 'pg_isready -U postgres' || (matrix.db == 'mariadb' && 'healthcheck.sh --connect' || 'mysqladmin ping -proot') }}"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      DB_CONNECTION: ${{ matrix.db }}
      DB_HOST: 127.0.0.1
      DB_PORT: 5555
      DB_DATABASE: bilyart_test
      DB_USERNAME: ${{ matrix.user }}
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_pgsql, intl, gd, sodium, bcmath, zip, pcntl, posix
          coverage: none
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('apps/api/composer.lock') }}
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
        if: matrix.db == 'mysql' && matrix.php == '8.3'
      - run: composer audit --no-dev
        if: matrix.db == 'mysql' && matrix.php == '8.3'
      - run: php artisan migrate:fresh --force && php artisan migrate:rollback --force && php artisan migrate --force
      - run: php artisan test

  web-admin:
    name: Web admin (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-admin/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build contains the hardening .htaccess
        run: test -f dist/.htaccess
      - uses: actions/upload-artifact@v4
        with:
          name: web-admin-dist
          path: apps/web-admin/dist/
          include-hidden-files: true # dist/.htaccess (CSP + cache headers)
          retention-days: 14

  tablet:
    name: Tablet kiosk (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tablet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/tablet/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build contains the .htaccess, face model and WASM runtime
        run: |
          test -f dist/.htaccess
          echo "b4578f35940bf5a1a655214a1cce5cab13eba73c1297cd78e1a04c2380b0152f  dist/models/blaze_face_short_range.tflite" | sha256sum -c -
          test -f dist/mediapipe/vision_wasm_internal.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: tablet-dist
          path: apps/tablet/dist/
          include-hidden-files: true # dist/.htaccess (CSP + camera permission)
          retention-days: 14

  firmware:
    name: ESP32 firmware (native tests, build .bin)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devices/esp32
    env:
      FW_VERSION: ${{ inputs.firmware_version || format('1.0.0-ci.{0}', github.run_number) }}
      DEFAULT_API_BASE: https://itcode.uz
      # Set in GitHub → Settings → Secrets and variables → Actions (docs/ESP32_FLASHING.md). Same value as the server's .env.
      DEVICE_REGISTRATION_SECRET: ${{ secrets.DEVICE_REGISTRATION_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('devices/esp32/platformio.ini') }}
      - name: Firmware version is semver
        run: echo "$FW_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::FW_VERSION must be semver"; exit 1; }
      - run: pip install platformio==6.1.18
      - name: Pinned CA bundle is up to date
        run: python scripts/make_ca_bundle.py --check
      - name: Unit tests on the host (session timing, commands, boot recovery)
        run: pio test -e native
      - name: Build firmware
        run: pio run -e esp32dev
      - name: Package (app + full factory image for the first flash)
        run: |
          set -e
          out=../../fw-out && mkdir -p $out
          b=.pio/build/esp32dev
          grep -aq "BLYFWVER:$FW_VERSION" $b/firmware.bin || { echo "::error::version marker missing from firmware.bin"; exit 1; }
          cp $b/firmware.bin $out/bilyart-esp32-$FW_VERSION.bin
          python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32 merge_bin -o $out/bilyart-esp32-$FW_VERSION-factory.bin \
            0x1000 $b/bootloader.bin 0x8000 $b/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin 0x10000 $b/firmware.bin
          (cd $out && sha256sum *.bin > SHA256SUMS.txt && cat SHA256SUMS.txt)
          if [ -z "$DEVICE_REGISTRATION_SECRET" ]; then
            echo "::warning::DEVICE_REGISTRATION_SECRET is not set — this build cannot register with the server (fine for CI, not for real devices)."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: fw-out/
          retention-days: 30

  deploy-scripts:
    name: Release package + server scripts (install, update, rollback)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bilyart_deploy
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Everything activate.sh requires, explicitly: the runner image's default set changes over time.
          extensions: pdo_mysql, gd, zip, dom, mbstring, fileinfo, ctype, tokenizer, xml
          coverage: none
          tools: composer:v2
      - name: Shell syntax
        run: for f in infrastructure/deploy/*.sh infrastructure/release/*.sh infrastructure/deploy/tests/*.sh; do bash -n "$f"; done
      - run: infrastructure/deploy/tests/run.sh
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: bilyart_deploy
          DB_USERNAME: root
          DB_PASSWORD: root
