name: Release package

# Builds bilyart-<version>.zip for the hosting: API + vendor (no dev) + admin/tablet PWAs + deploy scripts.
# Owner: Actions → Release package → Run workflow → version (e.g. 1.0.0) → download the artifact.
# Installing it: docs/DEPLOY_UZ.md. Nothing is uploaded anywhere by this workflow.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (semver, e.g. 1.0.0)'
        required: true
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Build release package
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version is semver
        run: echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' || { echo "::error::version must be semver, e.g. 1.0.0"; exit 1; }
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'   # the lowest supported version: the package must run there
          extensions: pdo_mysql, pdo_pgsql, gd, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Kiosk APK (skipped with a warning until the signing secrets exist)
        env:
          KIOSK_KEYSTORE_BASE64: ${{ secrets.KIOSK_KEYSTORE_BASE64 }}
          KIOSK_KEYSTORE_PASSWORD: ${{ secrets.KIOSK_KEYSTORE_PASSWORD }}
          KIOSK_BASE_URL: ${{ vars.PLATFORM_URL || 'https://nbx.itcode.uz' }}
        run: infrastructure/release/build-kiosk.sh "$VERSION" kiosk-out
      - run: KIOSK_DIR="$PWD/kiosk-out" infrastructure/release/build.sh "$VERSION" release-out
      - uses: actions/upload-artifact@v4
        with:
          name: bilyart-release-${{ inputs.version }}
          path: release-out/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: nbx-kiosk-apk-${{ inputs.version }}
          path: kiosk-out/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: ignore
