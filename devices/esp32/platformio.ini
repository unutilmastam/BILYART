; Billiard table light controller — ESP32 (Arduino framework).
; Built by GitHub Actions (firmware .bin artifacts). Host unit tests: `pio test -e native`.

[platformio]
default_envs = esp32dev

[common]
lib_deps =
    bblanchon/ArduinoJson@^7.4.2
build_flags =
    -std=gnu++17

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -DCORE_DEBUG_LEVEL=2
build_unflags = -std=gnu++11
extra_scripts = pre:scripts/defaults.py

; Pure logic (lib/core) compiled and tested on the build machine — no ESP32 needed.
[env:native]
platform = native
lib_deps = ${common.lib_deps}
build_flags = -std=gnu++17 -Wall -Wextra -DUNIT_TEST
test_framework = unity
